[project]
name = "skypro-homework2"
version = "0.1.0"
description = ""
authors = [
    {name = "Rychard",email = "rychard.famichou@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.9,<0.16.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-lazy-fixtures (>=1.4.0,<2.0.0)"
]

[tool.ruff]
# Длина строки (стандарт 88 или 120)
line-length = 120
# Целевая версия Python
target-version = "py312"

[tool.ruff.lint]
# Какие правила включить (E - ошибки, F - логика, I - импорты)
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.mypy]
# Указываем mypy искать модули в папке src
mypy_path = "src"
# ВКЛЮЧАЕМ этот флаг, чтобы убрать ошибку "Source file found twice"
explicit_package_bases = true
# Игнорируем отсутствие типов в сторонних библиотеках (если нужно)
ignore_missing_imports = true
# Проверять только ваш код (не лезть в виртуальное окружение)
exclude = ["venv", ".venv"]
# Строгая проверка типов (по желанию для учебы)
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=markdown"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:"
]
