[project]
name = "skypro-homework2"
version = "0.1.0"
description = ""
authors = [
    {name = "Rychard",email = "rychard.famichou@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=1.20.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-lazy-fixtures (>=1.4.0,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]


[tool.black]
line-length = 119
target-version = ['py312']
exclude = '''
/(
    \.git
    | __pycache__
)/
'''


[tool.isort]
line_length = 119


[tool.mypy]
# Указываем mypy искать модули в папке src
mypy_path = "src"
# Проверять только ваш код (не лезть в виртуальное окружение)
exclude = ["venv", ".venv"]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_return_any = true


[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=markdown"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:"
]
